<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desafio da Água</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d8fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Água">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f2f8fc;--card:#fff;--tx:#10212e;--mut:#5d7384;--ac:#1d8fe0;--ac2:#7cc8f5;--bd:#d6e6f1;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0c1822;--card:#142636;--tx:#e6f1f8;--mut:#93aab9;--ac:#4aaef0;--ac2:#2a6f9c;--bd:#244057}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;margin-top:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 8px;background:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.big{font-size:2rem;font-weight:700;text-align:center}
.row2{display:flex;align-items:center;gap:10px;margin:10px 0}
.pos{width:28px;text-align:center;font-size:1.2rem}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.nm{display:flex;justify-content:space-between;gap:8px}
.mut{color:var(--mut);font-size:.85rem}
#note{color:#d6453d;font-size:.85rem;text-align:center;min-height:1.2em}
#note.ok{color:var(--ac)}
.gitem{width:100%;text-align:left;margin-top:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:8px;font-size:.85rem}
#proofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.pf{margin:0}.pf img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bd);display:block}
.pf figcaption{font-size:.75rem;color:var(--mut);margin-top:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>💧 Desafio da Água</h1>
  <p class="sub" id="date"></p>

  <!-- LOGIN -->
  <section id="auth" class="card" hidden>
    <strong id="authTitle">Entrar</strong>
    <input id="aName" maxlength="30" placeholder="Seu nome (para o placar)" autocomplete="nickname" hidden>
    <input id="aEmail" type="email" placeholder="E-mail" autocomplete="email">
    <input id="aPass" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
    <div class="row"><button id="aGo">Entrar</button></div>
    <div class="row"><button class="alt" id="aSwitch">Não tenho conta</button></div>
    <p class="mut" id="aMsg"></p>
  </section>

  <!-- GRUPOS -->
  <section id="groups" hidden>
    <div class="card" id="gListCard" hidden>
      <strong>Seus grupos</strong>
      <div id="gList"></div>
    </div>
    <div class="card">
      <strong>Criar um grupo novo</strong>
      <input id="gName" maxlength="40" placeholder="Nome do grupo (ex.: Galera da água)">
      <div class="row"><button id="gCreate">Criar grupo</button></div>
    </div>
    <div class="card">
      <strong>Entrar com um código</strong>
      <input id="gCode" maxlength="40" placeholder="Código do convite" autocomplete="off" autocapitalize="off">
      <div class="row"><button class="alt" id="gJoin">Entrar no grupo</button></div>
    </div>
    <div class="row"><button class="alt" id="logout2">Sair da conta</button></div>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div class="card">
      <div class="nm"><strong id="gTitle"></strong><span class="mut" id="who"></span></div>
      <div class="row"><button class="alt" id="invite">Convidar amigos</button><button class="alt" id="switchGroup">Trocar de grupo</button></div>
      <div class="row"><button class="alt" id="membersBtn">Ver membros</button><button class="alt" id="leave">Sair do grupo</button></div>
      <div id="invBox" hidden>
        <div class="code" id="invLink"></div>
        <div class="row"><button id="invShare">Compartilhar link</button><button class="alt" id="invNew" hidden>Gerar novo código</button></div>
      </div>
    </div>

    <div class="card" id="membersCard" hidden>
      <strong>Membros</strong> <span class="mut" id="mCount"></span>
      <div id="mList"></div>
    </div>

    <div class="card">
      <div class="mut">Quanto você bebeu hoje?</div>
      <div class="big" id="mine">0 ml</div>
      <div class="mut" id="goalLine" style="text-align:center"></div>
      <div class="bar" style="margin-top:6px"><i id="goalBar" style="width:0"></i></div>
      <div class="row"><button id="bt">📸 Terminei a garrafinha</button></div>
      <p class="mut" style="margin:6px 0 0">Tire uma foto com a garrafinha de cabeça para baixo para valer.</p>
      <input type="file" id="shot" accept="image/*" capture="environment" hidden>
      <div class="row"><button data-ml="200">+200</button><button data-ml="300">+300</button><button data-ml="500">+500</button></div>
      <div class="row"><button class="alt" id="undo">Desfazer último</button><button class="alt" id="custom">Outro valor</button></div>
      <label for="bottle" class="mut" style="display:block;margin-top:12px">Tamanho da sua garrafinha (ml)</label>
      <div class="row"><input id="bottle" type="number" min="50" max="5000" step="50" inputmode="numeric" style="margin-top:0"><button class="alt" id="saveBottle" style="flex:0 0 100px">Salvar</button></div>
      <label for="goal" class="mut" style="display:block;margin-top:12px">Sua meta diária (ml)</label>
      <div class="row"><input id="goal" type="number" min="500" max="10000" step="100" inputmode="numeric" style="margin-top:0"><button class="alt" id="saveGoal" style="flex:0 0 100px">Salvar</button></div>
      <div class="row"><button class="alt" id="logout">Sair da conta</button></div>
    </div>

    <div class="card">
      <strong>Placar de hoje</strong> <span class="mut">(✅ = bateu a própria meta)</span>
      <div id="winner" class="mut" style="margin-top:8px" hidden></div>
      <div id="board"></div>
    </div>

    <div class="card">
      <strong>📸 Provas de hoje</strong>
      <div id="proofs"></div>
    </div>
  </section>

  <p id="note"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
// ====== CONFIGURAÇÃO ======
const SUPABASE_URL = "https://nwiqiaqeiwmvkylcjwrb.supabase.co";       // ex.: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_AUg94ROop6o5h3387WoKmQ_u_STvhdf";     // chave "anon" / "publishable" (pública por design)
const GOAL = 2000;               // meta diária em ml
const REQUIRE_PHOTO_ALL = false; // true = exige foto também nos botões +200/+300/+500/Outro valor
// ==========================

const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const note = (t, ok) => { const n = $("note"); n.textContent = t || ""; n.className = ok ? "ok" : ""; };
window.addEventListener("error", e => note("Erro: " + (e.message || "desconhecido")));
window.addEventListener("unhandledrejection", e => note("Erro: " + ((e.reason && e.reason.message) || "desconhecido")));

let sb = null, configError = "";
if (!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/i.test(SUPABASE_URL.trim())) {
  configError = "A SUPABASE_URL parece errada. Ela deve ser parecida com https://abcdxyz.supabase.co (a Project URL, sem nada depois).";
} else if (SUPABASE_ANON_KEY.trim().length < 20 || /COLE_AQUI/.test(SUPABASE_ANON_KEY)) {
  configError = "A SUPABASE_ANON_KEY parece errada ou vazia. Cole a chave publishable (sb_publishable_...) ou a anon.";
} else if (typeof supabase === "undefined") {
  configError = "Não consegui carregar a biblioteca do Supabase. Verifique a internet ou desative bloqueadores de anúncios.";
} else {
  try { sb = supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim()); }
  catch (e) { configError = "Erro ao iniciar o Supabase: " + (e && e.message ? e.message : e); }
}

const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

let day = today(), me = null, myName = "", myGoal = GOAL, winnerKey = "", logs = [], pending = 500, started = null, signup = false, channel = null;
let myGroups = [], group = null, members = [];
let bottle = parseInt(lsGet("agua-bottle"), 10) || 500;

$("date").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

// convite pelo link (?convite=CODIGO): guarda até a pessoa entrar/criar conta
const inviteParam = (new URLSearchParams(location.search).get("convite") || "").trim().toLowerCase();
if (inviteParam) lsSet("agua-invite", inviteParam);

function screen(name) {
  ["auth", "groups", "app"].forEach(s => $(s).hidden = s !== name);
}

// ---------- Login ----------
function setMode(isSignup) {
  signup = isSignup;
  $("authTitle").textContent = isSignup ? "Criar conta" : "Entrar";
  $("aName").hidden = !isSignup;
  $("aGo").textContent = isSignup ? "Criar conta" : "Entrar";
  $("aSwitch").textContent = isSignup ? "Já tenho conta" : "Não tenho conta";
  $("aPass").autocomplete = isSignup ? "new-password" : "current-password";
  $("aMsg").textContent = "";
}
$("aSwitch").onclick = () => setMode(!signup);

$("aGo").onclick = async () => {
  const email = $("aEmail").value.trim(), pass = $("aPass").value, name = $("aName").value.trim();
  if (!email || pass.length < 6 || (signup && !name)) { $("aMsg").textContent = "Preencha tudo (senha com 6+ caracteres)."; return; }
  $("aGo").disabled = true; $("aMsg").textContent = "";
  try {
    if (signup) {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
          data: { name },
          // o link do e-mail volta para este mesmo endereço (e mantém o convite, se houver)
          emailRedirectTo: location.origin + location.pathname + (lsGet("agua-invite") ? "?convite=" + encodeURIComponent(lsGet("agua-invite")) : "")
        } });
      if (error) throw error;
      if (!data.session) $("aMsg").textContent = "Conta criada! Confirme pelo e-mail que enviamos e depois entre.";
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    }
  } catch (e) { $("aMsg").textContent = e.message || "Erro ao entrar."; }
  $("aGo").disabled = false;
};

const logout = () => sb.auth.signOut();
$("logout").onclick = logout; $("logout2").onclick = logout;

function showAuth() {
  started = null; group = null; myGroups = [];
  if (channel) { sb.removeChannel(channel); channel = null; }
  screen("auth");
  const hasInvite = !!lsGet("agua-invite");
  setMode(hasInvite);
  if (hasInvite) $("aMsg").textContent = "Você foi convidado! Crie sua conta (ou entre, se já tiver) para participar do grupo.";
}

if (sb) sb.auth.onAuthStateChange((_ev, session) => {
  if (session && session.user) {
    if (started === session.user.id) return;
    me = session.user; started = me.id;
    setTimeout(afterLogin, 0); // evita chamar o Supabase dentro do callback de auth
  } else { me = null; showAuth(); }
});

// ---------- Grupos ----------
async function afterLogin() {
  const { data } = await sb.from("profiles").select("name,goal_ml").eq("id", me.id).maybeSingle();
  myName = (data && data.name) || me.email.split("@")[0];
  myGoal = (data && data.goal_ml) || GOAL;
  await usePendingInvite();
  await loadGroups();
  const saved = lsGet("agua-group");
  const g = myGroups.find(x => x.id === saved) || (myGroups.length === 1 ? myGroups[0] : null);
  if (g) openGroup(g); else showGroups();
}

async function usePendingInvite() {
  const code = lsGet("agua-invite");
  if (!code) return;
  const { data, error } = await sb.rpc("join_group", { code });
  lsDel("agua-invite");
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (error) { note("Esse convite não é válido (ou foi trocado). Peça um link novo."); return; }
  lsSet("agua-group", data.id);
}

async function loadGroups() {
  const { data, error } = await sb.from("members").select("groups(id,name,invite_code,owner_id)").eq("user_id", me.id);
  if (error) { note("Erro ao carregar grupos: " + error.message); return; }
  myGroups = (data || []).map(r => r.groups).filter(Boolean);
}

function showGroups() {
  group = null;
  if (channel) { sb.removeChannel(channel); channel = null; }
  screen("groups");
  const list = $("gList"); list.textContent = "";
  $("gListCard").hidden = !myGroups.length;
  myGroups.forEach(g => {
    const b = document.createElement("button"); b.className = "alt gitem"; b.textContent = g.name;
    b.onclick = () => openGroup(g); list.appendChild(b);
  });
}

$("gCreate").onclick = async () => {
  const name = $("gName").value.trim();
  if (!name) { note("Dê um nome ao grupo."); return; }
  $("gCreate").disabled = true;
  const { data, error } = await sb.rpc("create_group", { gname: name });
  $("gCreate").disabled = false;
  if (error) { note("Não consegui criar o grupo: " + error.message); return; }
  note(""); $("gName").value = ""; myGroups.push(data); openGroup(data, true);
};

$("gJoin").onclick = async () => {
  const code = $("gCode").value.trim().toLowerCase();
  if (!code) { note("Digite o código do convite."); return; }
  const { data, error } = await sb.rpc("join_group", { code });
  if (error) { note("Código inválido. Confira com quem te convidou."); return; }
  note(""); $("gCode").value = "";
  await loadGroups(); openGroup(myGroups.find(x => x.id === data.id) || data);
};

$("switchGroup").onclick = showGroups;

function inviteUrl() { return location.origin + location.pathname + "?convite=" + group.invite_code; }

$("invite").onclick = () => {
  const box = $("invBox"); box.hidden = !box.hidden;
  $("invLink").textContent = inviteUrl();
  $("invNew").hidden = group.owner_id !== me.id;
};
$("invShare").onclick = async () => {
  const url = inviteUrl(), text = "Entra no meu grupo do Desafio da Água: " + group.name;
  try {
    if (navigator.share) { await navigator.share({ title: "Desafio da Água", text, url }); return; }
    await navigator.clipboard.writeText(url); note("Link copiado! Cole numa conversa.", true);
  } catch (e) { note("Copie o link manualmente: " + url); }
};
$("invNew").onclick = async () => {
  if (!confirm("Gerar um novo código? O link antigo deixa de funcionar.")) return;
  const { data, error } = await sb.rpc("regenerate_invite", { gid: group.id });
  if (error) { note("Não consegui gerar o código: " + error.message); return; }
  group.invite_code = data; $("invLink").textContent = inviteUrl(); note("Novo link gerado.", true);
};

function openGroup(g) {
  group = g; lsSet("agua-group", g.id); logs = []; members = []; $("membersCard").hidden = true; note("");
  screen("app"); $("invBox").hidden = true;
  $("gTitle").textContent = g.name; $("who").textContent = myName;
  $("goal").value = myGoal; $("winner").hidden = true; winnerKey = "";
  $("bottle").value = bottle; refreshBottleLabel();
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("logs-" + g.id)
    .on("postgres_changes", { event: "*", schema: "public", table: "logs", filter: "group_id=eq." + g.id }, load)
    .subscribe();
  render(); load();
}

// ---------- Placar ----------
function refreshBottleLabel() { $("bt").textContent = "📸 Terminei a garrafinha (" + bottle + " ml)"; }

async function load() {
  if (!me || !group) return;
  const gid = group.id, d = today(); if (d !== day) day = d;
  const { data, error } = await sb.from("logs")
    .select("id,user_id,ml,photo_path,created_at,profiles(name,goal_ml)")
    .eq("group_id", gid).eq("day", day).order("created_at", { ascending: false });
  if (error) { note("Erro ao carregar: " + error.message); return; }
  if (!group || group.id !== gid) return; // trocou de grupo no meio do caminho
  note(""); logs = data || []; render(); loadMembers(); loadWinner();
}

function render() {
  const tot = {};
  logs.forEach(l => {
    const t = tot[l.user_id] || (tot[l.user_id] = { name: (l.profiles && l.profiles.name) || "?", goal: (l.profiles && l.profiles.goal_ml) || GOAL, ml: 0 });
    t.ml += l.ml;
  });
  const list = Object.values(tot).sort((a, b) => b.ml - a.ml);
  const b = $("board"); b.textContent = "";
  if (!list.length) { const p = document.createElement("p"); p.className = "mut"; p.textContent = "Ninguém bebeu nada ainda. Seja o primeiro!"; b.appendChild(p); }
  const medals = ["🥇", "🥈", "🥉"], max = Math.max(GOAL, list.length ? list[0].ml : 0);
  list.forEach((r, i) => {
    const w = document.createElement("div"); w.className = "row2";
    const pos = document.createElement("div"); pos.className = "pos"; pos.textContent = medals[i] || String(i + 1);
    const mid = document.createElement("div"); mid.style.flex = "1";
    const nm = document.createElement("div"); nm.className = "nm";
    const a = document.createElement("span"); a.textContent = r.name + (r.ml >= r.goal ? " ✅" : "");
    const c = document.createElement("span"); c.className = "mut"; c.textContent = r.ml + " / " + r.goal + " ml";
    nm.append(a, c);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = Math.min(100, Math.round(r.ml / max * 100)) + "%";
    bar.appendChild(fill); mid.append(nm, bar); w.append(pos, mid); b.appendChild(w);
  });
  const mineMl = logs.filter(l => l.user_id === me.id).reduce((s, l) => s + l.ml, 0);
  const pct = Math.min(100, Math.round(mineMl / myGoal * 100));
  $("mine").textContent = mineMl + " ml";
  $("goalLine").textContent = "Sua meta: " + myGoal + " ml · " + pct + "%" + (mineMl >= myGoal ? " ✅" : "");
  $("goalBar").style.width = pct + "%";

  const box = $("proofs"); box.textContent = "";
  const shots = logs.filter(l => l.photo_path).slice(0, 12);
  if (!shots.length) { const e = document.createElement("p"); e.className = "mut"; e.textContent = "Nenhuma prova ainda."; box.appendChild(e); }
  shots.forEach(l => {
    const f = document.createElement("figure"); f.className = "pf";
    const im = document.createElement("img");
    im.alt = "Prova de " + ((l.profiles && l.profiles.name) || ""); im.loading = "lazy";
    im.src = sb.storage.from("proofs").getPublicUrl(l.photo_path).data.publicUrl;
    const cap = document.createElement("figcaption");
    cap.textContent = ((l.profiles && l.profiles.name) || "?") + " · " + l.ml + " ml · " +
      new Date(l.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    f.append(im, cap); box.appendChild(f);
  });
  renderMembers();
}

// ---------- Vencedor de ontem, meta e sair do grupo ----------
async function loadWinner() {
  if (!me || !group) return;
  const gid = group.id, key = gid + "|" + day;
  if (winnerKey === key) return;
  winnerKey = key;
  const d = new Date(); d.setDate(d.getDate() - 1);
  const y = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const { data, error } = await sb.from("logs").select("user_id,ml,profiles(name)").eq("group_id", gid).eq("day", y);
  const box = $("winner");
  if (error) { winnerKey = ""; box.hidden = true; return; }
  if (!group || group.id !== gid) return;
  if (!data || !data.length) { box.hidden = true; return; }
  const tot = {};
  data.forEach(l => {
    const t = tot[l.user_id] || (tot[l.user_id] = { name: (l.profiles && l.profiles.name) || "?", ml: 0 });
    t.ml += l.ml;
  });
  const arr = Object.values(tot), top = Math.max.apply(null, arr.map(t => t.ml));
  box.textContent = "🏆 Vencedor de ontem: " + arr.filter(t => t.ml === top).map(t => t.name).join(" e ") + " (" + top + " ml)";
  box.hidden = false;
}

$("saveGoal").onclick = async () => {
  const v = parseInt($("goal").value, 10);
  if (!(v >= 500 && v <= 10000)) { note("A meta deve ficar entre 500 e 10000 ml."); $("goal").value = myGoal; return; }
  const { error } = await sb.from("profiles").update({ goal_ml: v }).eq("id", me.id);
  if (error) { note("Não consegui salvar a meta: " + error.message); return; }
  myGoal = v; await load(); note("Meta salva!", true);
};

$("leave").onclick = async () => {
  if (!group) return;
  const owner = group.owner_id === me.id, gid = group.id;
  const msg = 'Sair do grupo "' + group.name + '"?' + (owner ? "\n\nVocê é o dono: depois de sair, ninguém poderá gerar um novo código de convite." : "");
  if (!confirm(msg)) return;
  const { data, error } = await sb.from("members").delete().eq("group_id", gid).eq("user_id", me.id).select();
  if (error || !data || !data.length) { note("Não consegui sair do grupo."); return; }
  myGroups = myGroups.filter(x => x.id !== gid);
  if (lsGet("agua-group") === gid) lsDel("agua-group");
  showGroups(); note("Você saiu do grupo.", true);
};

// ---------- Membros ----------
async function loadMembers() {
  if (!me || !group) return;
  const gid = group.id;
  const { data, error } = await sb.from("members").select("user_id,joined_at,profiles(name)").eq("group_id", gid);
  if (error || !group || group.id !== gid) return;
  members = data || []; renderMembers();
}

function renderMembers() {
  if (!group) return;
  const open = !$("membersCard").hidden;
  $("membersBtn").textContent = open ? "Esconder membros" : "Ver membros" + (members.length ? " (" + members.length + ")" : "");
  $("mCount").textContent = members.length ? "(" + members.length + ")" : "";
  const box = $("mList"); box.textContent = "";
  if (!open) return;
  const ml = {};
  logs.forEach(l => { ml[l.user_id] = (ml[l.user_id] || 0) + l.ml; });
  const nameOf = m => (m.profiles && m.profiles.name) || "Sem nome";
  members.slice()
    .sort((a, b) => (ml[b.user_id] || 0) - (ml[a.user_id] || 0) || nameOf(a).localeCompare(nameOf(b), "pt-BR"))
    .forEach(m => {
      const row = document.createElement("div"); row.className = "row2";
      const mid = document.createElement("div"); mid.style.flex = "1";
      const nm = document.createElement("div"); nm.className = "nm";
      const a = document.createElement("span");
      a.textContent = nameOf(m) + (group.owner_id === m.user_id ? " 👑" : "") + (m.user_id === me.id ? " (você)" : "");
      const c = document.createElement("span"); c.className = "mut"; c.textContent = (ml[m.user_id] || 0) + " ml hoje";
      nm.append(a, c);
      const sub = document.createElement("div"); sub.className = "mut";
      sub.textContent = "No grupo desde " + new Date(m.joined_at).toLocaleDateString("pt-BR");
      mid.append(nm, sub); row.appendChild(mid); box.appendChild(row);
    });
}

$("membersBtn").onclick = () => {
  $("membersCard").hidden = !$("membersCard").hidden;
  renderMembers();
  if (!$("membersCard").hidden) loadMembers();
};

// ---------- Registros ----------
function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 800 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(bl => bl ? res(bl) : rej(new Error("falha ao processar a foto")), "image/jpeg", 0.7);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagem inválida")); };
    im.src = url;
  });
}

async function addLog(ml, blob) {
  if (!me || !group || !(ml > 0)) return;
  let path = null;
  if (blob) {
    path = me.id + "/" + Date.now() + ".jpg";
    const up = await sb.storage.from("proofs").upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) { note("Não consegui enviar a foto: " + up.error.message); return; }
  }
  const { error } = await sb.from("logs").insert({ group_id: group.id, ml, day, photo_path: path });
  if (error) { note("Não consegui salvar: " + error.message); return; }
  await load();
}

function ask(ml) {
  if (REQUIRE_PHOTO_ALL) { pending = ml; $("shot").click(); } else addLog(ml, null);
}

$("bt").onclick = () => { pending = bottle; $("shot").click(); };
$("shot").onchange = async function () {
  const f = this.files && this.files[0]; this.value = "";
  if (!f) return;
  try { note("Enviando…", true); await addLog(pending, await shrink(f)); }
  catch (e) { note("Não consegui ler a foto. Tente de novo."); }
};
document.querySelectorAll("[data-ml]").forEach(btn => btn.onclick = () => ask(parseInt(btn.dataset.ml, 10)));
$("custom").onclick = () => { const v = parseInt(prompt("Quantos ml?", "250"), 10); if (v > 0 && v <= 5000) ask(v); };
$("undo").onclick = async () => {
  const last = logs.find(l => l.user_id === me.id); // lista vem do mais novo para o mais antigo
  if (!last) return;
  const { error } = await sb.from("logs").delete().eq("id", last.id);
  if (error) { note("Não consegui desfazer: " + error.message); return; }
  if (last.photo_path) await sb.storage.from("proofs").remove([last.photo_path]);
  await load();
};
$("saveBottle").onclick = () => {
  const v = parseInt($("bottle").value, 10);
  if (v > 0) { bottle = Math.min(5000, Math.max(50, v)); lsSet("agua-bottle", String(bottle)); }
  $("bottle").value = bottle; refreshBottleLabel();
};

// atualiza o placar de tempos em tempos (e vira o dia sozinho)
setInterval(load, 30000);

// ---------- App instalável (PWA) ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

// ---------- Início ----------
if (configError) {
  note(configError);
} else {
  sb.auth.getSession().then(({ data }) => { if (!data.session) showAuth(); });
}
</script>
